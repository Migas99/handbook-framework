name: Feature
description: An outcome that needs several tasks.
labels: [feature]
projects: ["Migas99/2"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or goal, and why it matters now.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: The outcome. Its tasks are added as sub-issues.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Observable conditions that make this done, as a checklist.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: references
    attributes:
      label: References
      description: Decision records and related issues.
